services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: unless-stopped
    environment:
      - HUGGING_FACE_HUB_TOKEN=hf_your_token_here
    volumes:
      - /opt/huggingface-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    ipc: host
    command: >
      --model meta-llama/Meta-Llama-3.1-8B-Instruct
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --max-num-seqs 64
      --enforce-eager
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
