version: "3.8"
# Docker Swarm Single-Primary PostgreSQL Stack with Node-Label Constraint
# Ref: https://www.repobenchmarks.com
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_private
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.postgres_data == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        order: stop-first
        failure_action: pause

networks:
  db_private:
    driver: overlay
    internal: true

volumes:
  pgdata:
    driver: local

secrets:
  pg_password:
    external: true
